name: Fix Familia ARH Main Icon v2

on:
  push:
    paths:
      - '.github/workflows/fix-familia-icon-2.yml'

permissions:
  contents: write

jobs:
  fix-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install exact selected icon
        shell: bash
        run: |
          echo '' | base64 -d > familia-arh-icon.png
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          html = re.sub(r'<link rel="icon"[^>]*>', '<link rel="icon" type="image/png" href="familia-arh-icon.png?v=20260816d">', html, count=1)
          html = re.sub(r'<link rel="apple-touch-icon"[^>]*>', '<link rel="apple-touch-icon" href="familia-arh-icon.png?v=20260816d">', html, count=1)
          html = re.sub(r'(<img class="homeLogo"\s+src=")[^"]+("\s+alt="Familia ARH">)', r'\1familia-arh-icon.png?v=20260816d\2', html, count=1)
          p.write_text(html, encoding='utf-8')
          PY
      - name: Commit selected icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html familia-arh-icon.png
          git commit -m "Use selected Familia ARH icon [skip ci]" || exit 0
          git push
