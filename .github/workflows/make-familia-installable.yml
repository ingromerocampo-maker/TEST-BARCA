name: Make Familia ARH Installable PWA

on:
  push:
    paths:
      - '.github/workflows/make-familia-installable.yml'

permissions:
  contents: write

jobs:
  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add service worker and registration
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          reg = """<script>\nif ('serviceWorker' in navigator) {\n  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js?v=20260816pwa2').catch(console.error));\n}\n</script>\n"""
          if "serviceWorker.register('./sw.js" not in html:
              html = html.replace('</body>', reg + '</body>')
          html = html.replace('manifest.webmanifest?v=20260816pwa1','manifest.webmanifest?v=20260816pwa2')
          html = html.replace('familia-arh-192.png?v=20260816pwa1','familia-arh-192.png?v=20260816pwa2')
          p.write_text(html, encoding='utf-8')

          Path('sw.js').write_text("""const CACHE='familia-arh-v2';\nconst ASSETS=['./','./index.html','./manifest.webmanifest','./familia-arh-192.png','./familia-arh-512.png'];\nself.addEventListener('install',e=>{self.skipWaiting();e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)));});\nself.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));});\nself.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(fetch(e.request).catch(()=>caches.match(e.request).then(r=>r||caches.match('./index.html'))));});\n""", encoding='utf-8')
      - name: Commit PWA install support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Make Familia ARH installable PWA [skip ci]"
            git push
          fi