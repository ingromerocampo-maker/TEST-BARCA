name: Fix Cashy blank screen
on:
  push:
    paths:
      - '.github/workflows/fix-cashy-blank-screen.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move React mount into app bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path('cashy-public/app.jsx')
          s=app.read_text()
          mount="\nReactDOM.createRoot(document.getElementById('root')).render(<App />);\n"
          if mount.strip() not in s:
              app.write_text(s.rstrip()+mount)
          idx=Path('cashy-public/index.html')
          h=idx.read_text()
          h=h.replace('  <script type="text/babel">\n    ReactDOM.createRoot(document.getElementById(\'root\')).render(<App />);\n  </script>\n','')
          h=h.replace('20260817-static1','20260817-static2')
          idx.write_text(h)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cashy-public/app.jsx cashy-public/index.html
          git commit -m "Fix Cashy blank screen [skip ci]"
          git push
