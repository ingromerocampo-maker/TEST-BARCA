name: Configure Familia ARH PWA Icon

on:
  push:
    paths:
      - '.github/workflows/pwa-familia-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pwa-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create proper PWA icons
        shell: bash
        run: |
          set -e
          if command -v convert >/dev/null 2>&1; then
            convert familia-arh-icon.png -resize 192x192! familia-arh-192.png
            convert familia-arh-icon.png -resize 512x512! familia-arh-512.png
          elif command -v magick >/dev/null 2>&1; then
            magick familia-arh-icon.png -resize 192x192! familia-arh-192.png
            magick familia-arh-icon.png -resize 512x512! familia-arh-512.png
          else
            cp familia-arh-icon.png familia-arh-192.png
            cp familia-arh-icon.png familia-arh-512.png
          fi

      - name: Create web app manifest
        shell: bash
        run: |
          cat > manifest.webmanifest <<'EOF'
          {
            "name": "Familia ARH",
            "short_name": "Familia ARH",
            "description": "Todo tu mundo familiar en un solo lugar",
            "start_url": "/TEST-BARCA/",
            "scope": "/TEST-BARCA/",
            "display": "standalone",
            "background_color": "#07111f",
            "theme_color": "#07111f",
            "icons": [
              {
                "src": "familia-arh-192.png?v=20260816pwa1",
                "sizes": "192x192",
                "type": "image/png",
                "purpose": "any maskable"
              },
              {
                "src": "familia-arh-512.png?v=20260816pwa1",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any maskable"
              }
            ]
          }
          EOF

      - name: Link manifest and force icon refresh
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<link rel="icon"[^>]*>', '<link rel="icon" type="image/png" sizes="192x192" href="familia-arh-192.png?v=20260816pwa1">', s, count=1)
          s = re.sub(r'<link rel="apple-touch-icon"[^>]*>', '<link rel="apple-touch-icon" sizes="192x192" href="familia-arh-192.png?v=20260816pwa1">', s, count=1)
          if 'rel="manifest"' not in s:
              s = s.replace('<title>Familia ARH</title>', '<link rel="manifest" href="manifest.webmanifest?v=20260816pwa1">\n<meta name="mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-title" content="Familia ARH">\n<title>Familia ARH</title>')
          s = re.sub(r'<img class="homeLogo" src="[^"]+"', '<img class="homeLogo" src="familia-arh-192.png?v=20260816pwa1"', s, count=1)
          p.write_text(s, encoding='utf-8')

      - name: Commit PWA configuration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest familia-arh-192.png familia-arh-512.png
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Configure Familia ARH PWA icon [skip ci]"
            git push
          fi
